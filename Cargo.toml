[package]
name = "findlich"
description = "A Linux-first natural-language command center"
repository = "https://github.com/jranand/findlich"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
dirs = "7.0.0"
gtk = { version = "0.11.5", package = "gtk4" }
ignore = "0.4.33"
jiff = "0.2.38"
